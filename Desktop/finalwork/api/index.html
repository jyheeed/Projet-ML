<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Delay Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #1e293b; padding: 40px; border-radius: 16px; width: 540px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        .row { display: flex; gap: 12px; margin-bottom: 16px; }
        .field { flex: 1; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .result { margin-top: 24px; padding: 20px; border-radius: 12px; text-align: center; display: none; }
        .delayed { background: #991b1b; border: 1px solid #dc2626; }
        .ontime { background: #166534; border: 1px solid #22c55e; }
        .prediction-text { font-size: 28px; font-weight: 700; }
        .probability { font-size: 16px; margin-top: 8px; }
        .flight-info { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .section-label { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#9992; Flight Delay Predictor</h1>
        <p class="subtitle">Pre-flight prediction — no departure delay needed</p>

        <div class="section-label">Flight Info</div>
        <div class="row">
            <div class="field">
                <label>Airline</label>
                <select id="airline">
                    <option value="DL">Delta (DL)</option>
                    <option value="UA">United (UA)</option>
                    <option value="AA">American (AA)</option>
                    <option value="WN">Southwest (WN)</option>
                    <option value="B6">JetBlue (B6)</option>
                    <option value="NK">Spirit (NK)</option>
                    <option value="F9">Frontier (F9)</option>
                    <option value="AS">Alaska (AS)</option>
                    <option value="HA">Hawaiian (HA)</option>
                    <option value="G4">Allegiant (G4)</option>
                </select>
            </div>
            <div class="field">
                <label>Origin Airport</label>
                <select id="origin">
                    <option value="ATL">ATL — Atlanta</option>
                    <option value="DFW">DFW — Dallas</option>
                    <option value="DEN">DEN — Denver</option>
                    <option value="ORD">ORD — Chicago</option>
                    <option value="LAX" selected>LAX — Los Angeles</option>
                    <option value="CLT">CLT — Charlotte</option>
                    <option value="MCO">MCO — Orlando</option>
                    <option value="LAS">LAS — Las Vegas</option>
                    <option value="PHX">PHX — Phoenix</option>
                    <option value="MIA">MIA — Miami</option>
                    <option value="JFK">JFK — New York JFK</option>
                    <option value="EWR">EWR — Newark</option>
                    <option value="SFO">SFO — San Francisco</option>
                    <option value="SEA">SEA — Seattle</option>
                    <option value="MSP">MSP — Minneapolis</option>
                    <option value="BOS">BOS — Boston</option>
                    <option value="DTW">DTW — Detroit</option>
                    <option value="FLL">FLL — Fort Lauderdale</option>
                    <option value="IAH">IAH — Houston</option>
                    <option value="SLC">SLC — Salt Lake City</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>Destination Airport</label>
                <select id="dest">
                    <option value="ATL">ATL — Atlanta</option>
                    <option value="DFW">DFW — Dallas</option>
                    <option value="DEN">DEN — Denver</option>
                    <option value="ORD">ORD — Chicago</option>
                    <option value="LAX">LAX — Los Angeles</option>
                    <option value="CLT">CLT — Charlotte</option>
                    <option value="MCO">MCO — Orlando</option>
                    <option value="LAS">LAS — Las Vegas</option>
                    <option value="PHX">PHX — Phoenix</option>
                    <option value="MIA">MIA — Miami</option>
                    <option value="JFK" selected>JFK — New York JFK</option>
                    <option value="EWR">EWR — Newark</option>
                    <option value="SFO">SFO — San Francisco</option>
                    <option value="SEA">SEA — Seattle</option>
                    <option value="MSP">MSP — Minneapolis</option>
                    <option value="BOS">BOS — Boston</option>
                    <option value="DTW">DTW — Detroit</option>
                    <option value="FLL">FLL — Fort Lauderdale</option>
                    <option value="IAH">IAH — Houston</option>
                    <option value="SLC">SLC — Salt Lake City</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div class="field">
                <label>Distance (miles)</label>
                <input type="number" id="distance" value="2475" min="50" max="6000">
            </div>
        </div>

        <div class="section-label">Schedule</div>
        <div class="row">
            <div class="field">
                <label>Flight Duration (min)</label>
                <input type="number" id="duration" value="320" min="30" max="800">
            </div>
            <div class="field">
                <label>Departure Hour (0-23)</label>
                <input type="number" id="dep_hour" value="18" min="0" max="23">
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>Month</label>
                <select id="month">
                    <option value="1">January</option><option value="2">February</option>
                    <option value="3">March</option><option value="4">April</option>
                    <option value="5">May</option><option value="6">June</option>
                    <option value="7" selected>July</option><option value="8">August</option>
                    <option value="9">September</option><option value="10">October</option>
                    <option value="11">November</option><option value="12">December</option>
                </select>
            </div>
            <div class="field">
                <label>Day of Week</label>
                <select id="dow">
                    <option value="0">Monday</option><option value="1">Tuesday</option>
                    <option value="2">Wednesday</option><option value="3">Thursday</option>
                    <option value="4" selected>Friday</option><option value="5">Saturday</option>
                    <option value="6">Sunday</option>
                </select>
            </div>
            <div class="field">
                <label>Day of Month</label>
                <input type="number" id="day_of_month" value="15" min="1" max="31">
            </div>
        </div>

        <button onclick="predictDelay()">Predict Delay</button>

        <div class="result" id="result">
            <div class="prediction-text" id="predText"></div>
            <div class="probability" id="predProb"></div>
            <div class="flight-info" id="predFlight"></div>
        </div>
    </div>

    <script>
        // Historical delay rates by airline (approximate from training data)
        const airlineRates = {
            "DL": 0.14, "UA": 0.19, "AA": 0.18, "WN": 0.19,
            "B6": 0.22, "NK": 0.25, "F9": 0.24, "AS": 0.13,
            "HA": 0.15, "G4": 0.22
        };

        // Historical delay rates by airport
        const airportRates = {
            "ATL": 0.18, "DFW": 0.19, "DEN": 0.17, "ORD": 0.22,
            "LAX": 0.18, "CLT": 0.17, "MCO": 0.17, "LAS": 0.16,
            "PHX": 0.15, "MIA": 0.20, "JFK": 0.23, "EWR": 0.25,
            "SFO": 0.22, "SEA": 0.16, "MSP": 0.17, "BOS": 0.20,
            "DTW": 0.16, "FLL": 0.19, "IAH": 0.19, "SLC": 0.14,
            "OTHER": 0.18
        };

        // Busy airports (top 20)
        const busyAirports = ["ATL","DFW","DEN","ORD","LAX","CLT","MCO","LAS","PHX","MIA",
                              "JFK","EWR","SFO","SEA","MSP","BOS","DTW","FLL","IAH","SLC"];

        // Holiday dates (month, day)
        const holidays = [
            [1,1],[1,2],[7,3],[7,4],[7,5],
            [11,22],[11,23],[11,24],[11,25],[11,26],[11,27],
            [12,23],[12,24],[12,25],[12,26],[12,27],[12,28],[12,29],[12,30],[12,31],
            [5,25],[5,26],[5,27],[5,28],[9,1],[9,2],[9,3]
        ];

        // Hourly delay multiplier (delays increase through the day)
        const hourlyFactor = {
            0:0.7, 1:0.7, 2:0.7, 3:0.7, 4:0.7, 5:0.75, 6:0.8, 7:0.85,
            8:0.9, 9:0.9, 10:0.95, 11:0.95, 12:1.0, 13:1.0, 14:1.05,
            15:1.1, 16:1.15, 17:1.2, 18:1.25, 19:1.3, 20:1.3, 21:1.25, 22:1.1, 23:0.9
        };

        // Monthly delay multiplier
        const monthlyFactor = {
            1:1.05, 2:1.1, 3:0.95, 4:0.9, 5:0.9, 6:1.15,
            7:1.2, 8:1.1, 9:0.85, 10:0.85, 11:0.95, 12:1.15
        };

        async function predictDelay() {
            const airline = document.getElementById('airline').value;
            const origin = document.getElementById('origin').value;
            const dest = document.getElementById('dest').value;
            const month = parseInt(document.getElementById('month').value);
            const dow = parseInt(document.getElementById('dow').value);
            const dayOfMonth = parseInt(document.getElementById('day_of_month').value);
            const depHour = parseInt(document.getElementById('dep_hour').value);
            const distance = parseFloat(document.getElementById('distance').value);
            const duration = parseFloat(document.getElementById('duration').value);

            // Derived features
            const arrHour = (depHour + Math.floor(duration / 60)) % 24;
            const season = (month <= 2 || month == 12) ? 1 : month <= 5 ? 2 : month <= 8 ? 3 : 4;
            const timeBlock = depHour <= 6 ? 0 : depHour <= 12 ? 1 : depHour <= 18 ? 2 : 3;
            const isWeekend = dow >= 5 ? 1 : 0;
            const isEvening = depHour >= 17 ? 1 : 0;
            const isEarly = depHour <= 7 ? 1 : 0;
            const isLongHaul = distance > 1500 ? 1 : 0;
            const isBusyOrigin = busyAirports.includes(origin) ? 1 : 0;
            const isBusyDest = busyAirports.includes(dest) ? 1 : 0;
            const isHoliday = holidays.some(h => h[0] === month && h[1] === dayOfMonth) ? 1 : 0;

            // Target-encoded values (approximate from historical rates)
            const alRate = airlineRates[airline] || 0.18;
            const origRate = airportRates[origin] || 0.18;
            const destRate = airportRates[dest] || 0.18;
            const routeRate = (origRate + destRate) / 2;

            // Interaction encodings: base rate adjusted by time/season factors
            const hFactor = hourlyFactor[depHour] || 1.0;
            const mFactor = monthlyFactor[month] || 1.0;

            const airlineHourTe = Math.min(alRate * hFactor, 0.45);
            const originHourTe = Math.min(origRate * hFactor, 0.45);
            const airlineMonthTe = Math.min(alRate * mFactor, 0.45);
            const routeDowTe = routeRate * (dow === 4 || dow === 0 ? 1.1 : dow >= 5 ? 0.95 : 1.0);
            const destHourTe = Math.min(destRate * hourlyFactor[arrHour] || destRate, 0.45);

            const payload = {
                crs_elapsed_time: duration,
                distance: distance,
                dep_hour: depHour,
                arr_hour: arrHour,
                month: month,
                day_of_week: dow,
                day_of_month: dayOfMonth,
                is_weekend: isWeekend,
                season: season,
                time_block: timeBlock,
                is_busy_origin: isBusyOrigin,
                is_busy_dest: isBusyDest,
                is_evening: isEvening,
                is_early: isEarly,
                is_long_haul: isLongHaul,
                is_holiday: isHoliday,
                origin_te: origRate,
                dest_te: destRate,
                airline_te: alRate,
                route_te: routeRate,
                airline_hour_te: airlineHourTe,
                origin_hour_te: originHourTe,
                airline_month_te: airlineMonthTe,
                route_dow_te: routeDowTe,
                dest_hour_te: destHourTe
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = data.prediction === 'DELAYED' ? 'result delayed' : 'result ontime';
                document.getElementById('predText').textContent = data.prediction === 'DELAYED' ? '⚠ LIKELY DELAYED' : '✓ ON TIME';
                document.getElementById('predProb').textContent = 'Delay probability: ' + (data.delay_probability * 100).toFixed(1) + '%';
                document.getElementById('predFlight').textContent = airline + ' — ' + origin + ' → ' + dest + ' | ' + duration + 'min | ' + distance + 'mi';
            } catch (e) {
                alert('API Error: ' + e.message);
            }
        }
    </script>
</body>
</html>
